# ==============================================================================
# lefthook.yml — Golden Shift-Left Hook Configuration
# ==============================================================================

pre-commit:
  parallel: false
  commands:
    branch-policy:
      run: bash scripts/check-branch.sh
    format-check:
      run: dart format --output=none --set-exit-if-changed lib test
    lint:
      run: make lint

commit-msg:
  commands:
    conventional-commit:
      run: |
        FIRST_LINE=$(head -n 1 {1})
        if [[ ! "$FIRST_LINE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?: .+ ]] && [[ ! "$FIRST_LINE" =~ ^chore\(release\): ]] && [[ ! "$FIRST_LINE" =~ ^Merge ]]; then
          echo -e "\033[31m[ERROR] Commit message must follow Conventional Commits standard (e.g., feat: description)\033[0m"
          exit 1
        fi
